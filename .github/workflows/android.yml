# 5L0P-F1NG3RPR1NT: AI-assisted Android wrapper scaffold for the user's fork.
name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/**"
      - "android/**"
      - "app/**"
      - "core/**"
      - "Cargo.toml"
      - "Cargo.lock"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
          target: aarch64-linux-android
      - uses: android-actions/setup-android@v3
        with:
          packages: ""
      - name: Install NDK and Gradle
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.0.12433566"
          curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.10.2/bin" >> "$GITHUB_PATH"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.12433566" >> "$GITHUB_ENV"
          cargo install cargo-ndk --locked
      - name: Build Rust binary
        env:
          RUSTFLAGS: ""
        run: ./android/build-rust.sh
      - name: Build APK
        run: gradle -p android assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: penumbra-tools-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
