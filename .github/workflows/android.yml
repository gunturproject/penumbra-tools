# 5L0P-F1NG3RPR1NT: AI-assisted Android wrapper scaffold for the user's fork.
name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - "app/**"
      - "core/**"
      - "Cargo.toml"
      - "Cargo.lock"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
          targets: aarch64-linux-android
      - uses: android-actions/setup-android@v3
      - name: Install NDK and Gradle
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.0.12433566"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.12433566" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y gradle
          cargo install cargo-ndk --locked
      - name: Build Rust binary
        run: ./android/build-rust.sh
      - name: Build APK
        run: gradle -p android assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: penumbra-tools-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
